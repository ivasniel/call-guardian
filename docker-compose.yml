services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: localroot
      MYSQL_DATABASE: call_guardian
      MYSQL_USER: guardian
      MYSQL_PASSWORD: guardian_dev_only
    ports: ["3307:3306"]
    volumes:
      - guardian_mysql:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  guardian_mysql:
